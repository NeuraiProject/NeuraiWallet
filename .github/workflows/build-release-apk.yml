name: BuildReleaseApk

# Builds the release APK on every pull request and push to master. Pull requests
# sign it with a throwaway key made for the run (fastlane `auto_credentials`), so
# the upload key never reaches a PR build; a push to master uses the
# KEYSTORE_FILE_HEX / KEYSTORE_PASSWORD secrets when they are set.

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  buildReleaseApk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - name: Free disk space (Android build)
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          df -h

      - name: Specify node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use gradle caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The runner image ships the Android SDK and its command-line tools; the
      # NDK removed above is installed again at the version the project pins.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' android/build.gradle)
          test -n "$NDK_VERSION" || { echo "ndkVersion not found in android/build.gradle"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"

      - name: Install node_modules (include dev deps for patch-package)
        run: npm ci --yes

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: 3.4.8
          bundler-cache: true

      - name: Generate Build Number based on timestamp
        id: build_number
        run: |
          NEW_BUILD_NUMBER="$(date +%s)"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $GITHUB_ENV
          echo "build_number=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build and sign APK
        id: build_and_sign_apk
        run: |
          if [ -n "$KEYSTORE_FILE_HEX" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            bundle exec fastlane android build_release_apk
          else
            echo "Signing with a throwaway key made for this run."
            bundle exec fastlane android build_release_apk auto_credentials:true
          fi
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
          # Only a push to master gets the upload key.
          KEYSTORE_FILE_HEX: ${{ github.event_name == 'push' && secrets.KEYSTORE_FILE_HEX || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.KEYSTORE_PASSWORD || '' }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-logs
          path: |
            fastlane/logs/**/*.log
            android/**/*.log
            android/**/build/**/*.log
            android/**/outputs/logs/**/*.log
            android/**/reports/**/*.log
          if-no-files-found: warn

      - name: Determine APK Filename and Path
        id: determine_apk_path
        run: |
          BUILD_NUMBER=${{ steps.build_number.outputs.build_number }}
          VERSION_NAME=$(grep versionName android/app/build.gradle | awk '{print $2}' | tr -d '"')
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')

          if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "master" ]; then
            EXPECTED_FILENAME="NeuraiWallet-${VERSION_NAME}-${BUILD_NUMBER}-${BRANCH_NAME}.apk"
          else
            EXPECTED_FILENAME="NeuraiWallet-${VERSION_NAME}-${BUILD_NUMBER}.apk"
          fi
      
          APK_PATH="android/app/build/outputs/apk/release/${EXPECTED_FILENAME}"
          echo "EXPECTED_FILENAME=${EXPECTED_FILENAME}" >> $GITHUB_ENV
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
