apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Load the upload-keystore credentials when present. The real file is gitignored;
// see android/keystore.properties.example for the schema.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    androidResources {
        noCompress += ["bundle"]
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "org.neurai.neuraiwallet"
    defaultConfig {
        applicationId "org.neurai.neuraiwallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is the Unix timestamp of the build (NeuraiWallet legacy
        // convention: the About screen renders `new Date(versionCode * 1000)`).
        // Bump this on each release to keep the timeline correct.
        versionCode 1781006385
        versionName "1.0.3"
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Keep compatibility across react-native-capture-protection flavor changes.
        missingDimensionStrategy "react-native-capture-protection", "callbackTiramisu", "base"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', 'src/main/res/assets']
            java.srcDirs = ['src/main/java', '../../blue_modules/Views/SegmentedControl/android']
        }
    }

    signingConfigs {
        // Play Store / production releases. Reads credentials from
        // android/keystore.properties when present; falls back to the
        // debug keystore so CI and local builds keep working without
        // access to the real upload key.
        release {
            if (keystoreProperties['NEURAI_UPLOAD_STORE_FILE']) {
                storeFile file(keystoreProperties['NEURAI_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['NEURAI_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['NEURAI_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['NEURAI_UPLOAD_KEY_PASSWORD']
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        // Override AGP's default ~/.android/debug.keystore so debug builds
        // share a signature with the sideloaded release APK and can update
        // it in place without uninstall.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
            // Include native debug symbols in the AAB so Play Console can
            // symbolicate native (.so) crashes — e.g. the libjsi
            // valueFromDynamic report. Does not affect the user's download size.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

}

task copyFiatUnits(type: Copy) {
    from '../../models/fiatUnits.json'
    into 'src/main/assets'
}

preBuild.dependsOn(copyFiatUnits)

// Ensure fiat units are available before codegen scans JS sources
tasks.configureEach { task ->
    if (task.name == 'generateCodegenSchemaFromJavaScript') {
        task.dependsOn(copyFiatUnits)
    }
}

dependencies {
		androidTestImplementation('com.wix:detox:+')
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.compose.ui:ui:1.10.6'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Firebase Cloud Messaging — required by react-native-notifications (Wix)
    // to compile its Android FCM bridge. Without a google-services.json the
    // FirebaseApp won't initialize at runtime (FirebaseInitProvider logs a
    // warning and stays dormant), and the JS notifications module catches any
    // resulting errors. Drop in a Neurai Firebase google-services.json to
    // activate push delivery.
    implementation platform("com.google.firebase:firebase-bom:33.6.0")
    implementation 'com.google.firebase:firebase-messaging'
}

// Block the legacy `com.android.support:*` artifacts that some transitive deps
// (e.g. `play-services-iid` brought in by `react-native-device-info`) still
// pull in. They duplicate classes that already exist in AndroidX (`androidx.*`)
// and break the debug build with `Duplicate class` errors.
configurations.all {
    exclude group: 'com.android.support'
}
// Apply the Google Services plugin only when google-services.json is present.
// This lets fresh checkouts compile without Firebase config; drop the file in
// to activate FCM token registration. The classpath dep is unconditional in
// android/build.gradle so this `apply plugin` is the only switch.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Bugsnag plugin removed: NeuraiWallet has no crash-reporting backend; the
// inherited NeuraiWallet Bugsnag project key was leaking error reports off to
// NeuraiWallet's account. Re-add once Neurai has its own Bugsnag project.
